[project]
name = "ndm"
version = "0.1.0"
description = "Nex Download Manager — a quiet, capable download engine with a Nexa desktop UI"
readme = "README.md"
authors = [{ name = "Parsa", email = "parsam280xyz@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "nexa-ui>=1.4.0,<2",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
ndm = "ndm:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
